name: Multi-Platform Build (STM32 & Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Сборка прошивок для микроконтроллеров STM32
  build-and-pack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: "stm32f401xc-debug"
            os: ubuntu-latest
            test: false
          - preset: "stm32f411xe-debug"
            os: ubuntu-latest
            test: false
          - preset: "win-debug"
            os: windows-latest
            test: true
          - preset: "win-release"
            os: windows-latest
            test: true
          - preset: "linux-debug"
            os: ubuntu-latest
            test: true
          - preset: "macos-debug"
            os: macos-latest
            test: true
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    - name: Install Arm GNU Toolchain (Linux)
      if: runner.os == 'Linux'
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '14.2.Rel1'

    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      run: choco install ninja

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install ninja

    - name: Set up MSVC Developer Command Prompt (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}

    - name: Build Firmware
      run: cmake --build --preset ${{ matrix.preset }}

    - name: Run Tests
      if: matrix.test
      run: ctest --preset ${{ matrix.preset }} --output-on-failure

    - name: Install and Organize SDK
      run: cmake --install build/${{ matrix.preset }} --prefix dist/${{ matrix.preset }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LetoCore-${{ matrix.preset }}
        path: dist/${{ matrix.preset }}/
        if-no-files-found: error
  
  ci-result:
    name: CI Result
    if: always()
    needs: [build-and-pack]
    runs-on: ubuntu-latest
    steps:
      - name: Check all matrix jobs status
        run: |
          # Проверяем, что все джобы из needs завершились со статусом success
          if [[ "${{ needs.build-and-pack.result }}" != "success" ]]; then
            echo "❌ Один или несколько джобов матрицы завершились с ошибкой."
            exit 1
          fi
          echo "✅ Все сборки и тесты успешно пройдены."
