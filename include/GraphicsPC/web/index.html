<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>STM32 Universal Display Emulator</title>
  <style>
    :root { --bg: #0f0f12; --fg: #e0e0e0; --accent: #4a9; --accent2: #a44; }
    body {
      background: var(--bg); color: var(--fg); font-family: monospace;
      display: flex; flex-direction: column; align-items: center;
      margin: 0; padding: 20px; min-height: 100vh;
    }
    h2 { margin: 0 0 15px; }
    canvas {
      border: 3px solid #333;
      background: #000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 20px;
      max-width: 300px;
    }
    button {
      padding: 12px; font-size: 18px; font-weight: bold;
      background: #2a2a3a; color: var(--fg); border: 2px solid #444;
      border-radius: 6px; cursor: pointer; user-select: none;
      transition: transform 0.05s ease, filter 0.05s ease;
    }
    button.active { 
      transform: scale(0.95);
      filter: brightness(1.3);
    }
    button.dpad { background: #1a3a5a; }
    button.action-a { background: var(--accent); border-color: #3a7; }
    button.action-b { background: var(--accent2); border-color: #933; }
    #status { margin-top: 15px; color: #888; font-size: 14px; text-align: center; }
    #fps { position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    #displayInfo { margin-top: 8px; color: #66a; font-size: 12px; }
  </style>
</head>
<body>
  <h2>🎮 STM32 Console</h2>
  <canvas id="lcd"></canvas>
  <div id="displayInfo">⏳ Загрузка параметров дисплея...</div>
  
  <div class="controls">
    <div></div>
    <button class="dpad" data-key="U">▲</button>
    <div></div>
    <button class="dpad" data-key="L">◄</button>
    <button class="dpad" data-key="D">▼</button>
    <button class="dpad" data-key="R">►</button>
    <div></div>
    <button class="action-a" data-key="A">A</button>
    <button class="action-b" data-key="B">B</button>
  </div>
  
  <div id="status">⏳ Подключение...</div>
  <div id="fps">FPS: --</div>

  <script>
    // ===== Конфигурация (базовые значения, будут перезаписаны с сервера) =====
    const CONFIG = {
      POLL_INTERVAL: 15,              // мс между запросами кадра (~60 FPS)
      SERVER_HOST: location.hostname,
      SERVER_PORT: 12300,
      
      // 🔥 Динамические параметры (загружаются с сервера)
      display: {
        width: 128,                   // временное значение до загрузки
        height: 64,
        pixelScale: 2,                // коэффициент масштабирования пикселя на canvas
        format: 'uint32'              // неизменный формат: 0x00RRGGBB (little-endian)
      },
      
      get baseUrl() {
        return `http://${this.SERVER_HOST}:${this.SERVER_PORT}`;
      }
    };

    // ===== Глобальные переменные =====
    const canvas = document.getElementById('lcd');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    ctx.imageSmoothingEnabled = false; // 🔥 Чёткие пиксели без сглаживания
    
    const statusEl = document.getElementById('status');
    const fpsEl = document.getElementById('fps');
    const displayInfoEl = document.getElementById('displayInfo');
    
    let lastFrameTime = 0;
    let frameCount = 0;
    let isRunning = false;
    let displayInitialized = false;

    // ===== Запрос параметров дисплея с сервера =====
    async function fetchDisplayInfo() {
      try {
        const res = await fetch(`${CONFIG.baseUrl}/display_info`, {
          method: 'GET',
          cache: 'no-store',
          headers: { 'Accept': 'application/json' }
        });
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const info = await res.json();
        
        // 🔥 Валидация обязательных полей
        if (typeof info.width !== 'number' || info.width <= 0 ||
            typeof info.height !== 'number' || info.height <= 0 ||
            typeof info.pixelScale !== 'number' || info.pixelScale <= 0) {
          throw new Error('Некорректные параметры дисплея в ответе сервера');
        }
        
        // 🔥 Применение полученных параметров
        CONFIG.display.width = info.width;
        CONFIG.display.height = info.height;
        CONFIG.display.pixelScale = info.pixelScale;
        
        // 🔥 Настройка canvas под полученное разрешение
        canvas.width = CONFIG.display.width * CONFIG.display.pixelScale;
        canvas.height = CONFIG.display.height * CONFIG.display.pixelScale;
        
        console.log(`📺 Дисплей: ${CONFIG.display.width}×${CONFIG.display.height}, масштаб: ${CONFIG.display.pixelScale}x`);
        return true;
        
      } catch (e) {
        console.warn('❌ /display_info:', e.message);
        // 🔥 Fallback: используем значения по умолчанию
        console.log('⚠ Используем параметры по умолчанию: 128×64, масштаб 2x');
        canvas.width = 128 * 2;
        canvas.height = 64 * 2;
        return false;
      }
    }

    // ===== Рендер универсального дисплея (WinAPI 0x00RRGGBB) =====
    function drawUniversal(buf) {
      if (!displayInitialized) return;
      
      const { width, height, pixelScale } = CONFIG.display;
      const expectedBytes = width * height * 4; // 4 байта на uint32
      
      // 🔥 Проверка размера буфера
      if (buf.byteLength !== expectedBytes) {
        console.warn(`⚠ Размер буфера: ожидалось ${expectedBytes} байт, получено ${buf.byteLength}`);
        return;
      }
      
      // 🔥 DataView для чтения uint32 в little-endian (стандарт WinAPI/x86)
      const view = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
      
      // 🔥 Оптимизация: создаём ImageData один раз вне цикла (если нужно ещё больше скорости)
      // Для простоты здесь используем fillRect, но можно заменить на putImageData
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // 🔥 Отрисовка пикселей
      for (let i = 0; i < width * height; i++) {
        // Читаем 32-битное значение: 0x00RRGGBB (little-endian)
        const pixel = view.getUint32(i * 4, true);
        
        // 🔥 Извлечение RGB-компонент
        const r = (pixel >> 16) & 0xFF;
        const g = (pixel >> 8) & 0xFF;
        const b = pixel & 0xFF;
        
        // 🔥 Вычисление 2D-координат из линейного индекса
        const x = i % width;
        const y = Math.floor(i / width);
        
        // 🔥 Отрисовка масштабированного пикселя
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(x * pixelScale, y * pixelScale, pixelScale, pixelScale);
      }
    }

    // ===== Сетевые запросы =====
    const API = {
      async draw() {
        try {
          const res = await fetch(`${CONFIG.baseUrl}/draw`, { 
            method: 'GET', 
            cache: 'no-store',
            headers: { 'Accept': 'application/octet-stream' }
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return new Uint8Array(await res.arrayBuffer());
        } catch (e) {
          console.warn('❌ /draw:', e.message);
          return null;
        }
      },
      
      input(source, id, type) {
        const payload = `${source}:${id}:${type}`;
        fetch(`${CONFIG.baseUrl}/input`, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: payload
        }).catch(e => console.warn('❌ /input:', e.message));
      }
    };

    // ===== Цикл опроса кадра =====
    async function pollFrame() {
      if (!isRunning || !displayInitialized) return;
      
      const buf = await API.draw();
      if (buf) {
        drawUniversal(buf);
        
        // FPS counter
        frameCount++;
        const now = performance.now();
        if (now - lastFrameTime >= 1000) {
          fpsEl.textContent = `FPS: ${frameCount}`;
          frameCount = 0;
          lastFrameTime = now;
        }
      }
      
      setTimeout(pollFrame, CONFIG.POLL_INTERVAL);
    }

    // ===== Отправка события ввода =====
    function sendInputEvent(source, id, type) {
      API.input(source, id, type);
    }

    // ===== Обработчики кнопок =====
    document.querySelectorAll('button[data-key]').forEach(btn => {
      const idMap = { 'U': 1, 'D': 2, 'L': 3, 'R': 4, 'A': 5, 'B': 6 };
      const key = btn.dataset.key;
      const id = idMap[key];
      if (!id) return;
      
      const onPress = (e) => {
        e?.preventDefault();
        sendInputEvent('B', id, 1);
        btn.classList.add('active');
      };
      const onRelease = (e) => {
        e?.preventDefault();
        sendInputEvent('B', id, 2);
        btn.classList.remove('active');
      };
      
      btn.addEventListener('mousedown', onPress);
      btn.addEventListener('touchstart', onPress, { passive: false });
      btn.addEventListener('mouseup', onRelease);
      btn.addEventListener('mouseleave', onRelease);
      btn.addEventListener('touchend', onRelease);
      btn.addEventListener('touchcancel', onRelease);
    });

    // ===== Маппинг клавиатуры =====
    const KEYBOARD_MAP = {
      'ArrowUp':    { source: 'B', id: 1 },
      'ArrowDown':  { source: 'B', id: 2 },
      'ArrowLeft':  { source: 'B', id: 3 },
      'ArrowRight': { source: 'B', id: 4 },
      'Enter':      { source: 'B', id: 5 },
      'Escape':     { source: 'B', id: 6 },
      'KeyQ':       { source: 'E', id: 129, type: 2 },
      'KeyW':       { source: 'E', id: 129, type: 1 },
    };

    const pressedKeys = new Set();

    window.addEventListener('keydown', function(e) {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter'].includes(e.code)) {
        e.preventDefault();
      }
    }, false);

    document.addEventListener('keydown', (e) => {
      const mapping = KEYBOARD_MAP[e.code];
      if (!mapping || pressedKeys.has(e.code)) return;
      
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Escape',' '].includes(e.key)) {
        e.preventDefault();
      }
      
      if (mapping.source === 'E') {
        sendInputEvent(mapping.source, mapping.id, mapping.type);
        return;
      }
      
      sendInputEvent(mapping.source, mapping.id, 1);
      pressedKeys.add(e.code);
      highlightVirtualButton(mapping.id, true);
    });

    document.addEventListener('keyup', (e) => {
      const mapping = KEYBOARD_MAP[e.code];
      if (!mapping || mapping.source === 'E') return;
      
      sendInputEvent(mapping.source, mapping.id, 2);
      pressedKeys.delete(e.code);
      highlightVirtualButton(mapping.id, false);
    });

    function highlightVirtualButton(inputId, isPressed) {
      const idToKey = { 1:'U', 2:'D', 3:'L', 4:'R', 5:'A', 6:'B' };
      const key = idToKey[inputId];
      if (!key) return;
      
      const btn = document.querySelector(`button[data-key="${key}"]`);
      if (btn) {
        btn.classList.toggle('active', isPressed);
      }
    }

    // ===== Инициализация =====
    async function init() {
      statusEl.textContent = '🔄 Запрос параметров дисплея...';
      
      // 🔥 Шаг 1: Запрашиваем параметры дисплея
      const infoLoaded = await fetchDisplayInfo();
      
      // Обновляем отображение информации о дисплее
      displayInfoEl.textContent = `📐 ${CONFIG.display.width}×${CONFIG.display.height} @ ${CONFIG.display.pixelScale}x`;
      
      // 🔥 Шаг 2: Проверяем доступность сервера отрисовки
      statusEl.textContent = '🔄 Проверка соединения...';
      const buf = await API.draw();
      
      if (buf) {
        statusEl.textContent = `🟢 Подключено: ${CONFIG.baseUrl}`;
        displayInitialized = true;
        isRunning = true;
        
        // 🔥 Шаг 3: Запускаем цикл отрисовки
        pollFrame();
      } else {
        statusEl.textContent = '🔴 Сервер недоступен';
        displayInfoEl.textContent = '⚠ Повтор через 3 сек...';
        setTimeout(init, 3000);
      }
    }

    // ===== Запуск =====
    window.addEventListener('load', init);
    
    document.addEventListener('visibilitychange', () => {
      isRunning = !document.hidden;
      if (isRunning && displayInitialized) {
        pollFrame();
      }
    });
  </script>
</body>
</html>
